<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Nexon Attendance System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3651d4;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px 30px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #666;
            font-size: 0.95rem;
            margin: 0;
        }
        
        .form-label {
            font-weight: 500;
            color: #444;
        }
        
        .form-control {
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1.5px solid #ddd;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            background: var(--primary-color);
            border: none;
            color: white;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            background: var(--primary-hover);
        }
        
        .btn-login:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        
        .alert {
            border-radius: 8px;
            font-size: 0.95rem;
        }
        
        .demo-credentials {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        
        .demo-credentials h6 {
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
        }
        
        .demo-credentials code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        
        .phase-badge {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.9);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #764ba2;
        }
    </style>
</head>
<body>
    <!-- Phase indicator -->
    <div class="phase-badge">Phase 1 Demo</div>
    
    <!-- Login Card -->
    <div class="login-card">
        <div class="login-header">
            <h1>🏢 Nexon Attendance</h1>
            <p>Location-based attendance system</p>
        </div>
        
        <!-- Error Message Container -->
        <div id="messageContainer"></div>
        
        <!-- Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    class="form-control" 
                    id="email" 
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="password" 
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>
            
            <button type="submit" class="btn btn-login" id="loginBtn">
                Login
            </button>
        </form>
        
        <!-- Demo Credentials -->
        <div class="demo-credentials">
            <h6>📋 Login Credentials</h6>
            <div>
                <strong>Admin:</strong> <code>admin@company.com</code> / <code>admin123</code>
            </div>
        </div>
    </div>
    
    <!-- Load JS Modules (order matters) -->
    <script src="./js/storage.js"></script>
    <script src="./js/auth.js"></script>
    
    <script>
        // Guard: If already logged in, redirect to default page
        if (!Auth.guardPage(PageType.LOGIN)) {
            // guardPage handles redirect, stop execution
        } else {
            // Page initialization
            initLoginPage();
        }
        
        function initLoginPage() {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageContainer = document.getElementById('messageContainer');
            
            // Handle form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Clear previous messages
                messageContainer.innerHTML = '';
                
                // Get input values
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                
                // Disable button during login
                loginBtn.disabled = true;
                loginBtn.textContent = 'Logging in...';
                
                // Attempt login
                const result = Auth.login(email, password);
                
                if (result.success) {
                    // Show success message briefly
                    showMessage('Login successful! Redirecting...', 'success');
                    
                    // Redirect to role-appropriate page
                    setTimeout(() => {
                        Auth.redirectToDefaultPage();
                    }, 500);
                } else {
                    // Show error message
                    showMessage(result.message, 'error');
                    
                    // Re-enable button
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            });
            
            // Clear error on input
            emailInput.addEventListener('input', () => messageContainer.innerHTML = '');
            passwordInput.addEventListener('input', () => messageContainer.innerHTML = '');
        }
        
        function showMessage(message, type) {
            const messageContainer = document.getElementById('messageContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
            messageContainer.innerHTML = `
                <div class="alert ${alertClass}" role="alert">
                    ${message}
                </div>
            `;
        }
    </script>
</body>
</html>
